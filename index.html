<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movo - 청소년 운동 & 학습 연계 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 3D 코인 회전 및 적립 애니메이션 */
        @keyframes coinFlip {
            0% { transform: scale(0.2) rotateY(0deg) translateY(50px); opacity: 0; }
            50% { transform: scale(1.3) rotateY(720deg) translateY(-20px); opacity: 1; }
            100% { transform: scale(1) rotateY(1440deg) translateY(0); opacity: 1; }
        }
        .animate-coin { animation: coinFlip 1.2s ease-out forwards; }
        
        /* 로고 스티커 효과 */
        .movo-logo-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
    </style>
</head>

                <div class="flex flex-col">

                            <span id="sync-text">스마트폰 연결됨</span>
                        </div>
                    </div>
